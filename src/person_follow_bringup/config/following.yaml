following_server:
  ros__parameters:
    controller_frequency: 30.0
    detection_timeout: 0.5
    static_object_timeout: -1.0
    rotate_to_object_timeout: 3.0
    linear_tolerance: 0.03
    angular_tolerance: 0.08
    max_retries: 0
    base_frame: base_footprint
    fixed_frame: odom
    desired_distance: 1.5
    skip_orientation: true
    search_by_rotating: false
    filter_coef: 0.4
    odom_topic: /odom
    odom_duration: 0.3
    transform_tolerance: 0.2
    controller:
      k_phi: 1.0
      k_delta: 2.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.01
      v_linear_max: 0.20
      v_angular_max: 0.60
      slowdown_radius: 0.25
      use_collision_detection: false
      transform_tolerance: 0.2
follow_supervisor:
  ros__parameters:
    desired_distance: 1.5
    base_frame: base_footprint
    fixed_frame: odom
    camera_frame: camera_color_optical_frame
    stop_margin: 0.02
    resume_margin: 0.12
    turn_enter: 0.30
    turn_exit: 0.12
    angle_deadband: 0.05
    angular_gain: 1.6
    distance_gain: 0.6
    max_linear: 0.20
    max_angular: 0.60
    max_linear_acceleration: 0.35
    max_angular_acceleration: 1.2
    point_timeout: 0.5
    receipt_timeout: 0.5
    raw_timeout: 0.3
    odom_timeout: 0.5
    future_tolerance: 0.05
    recovery_duration: 0.20
    recovery_frames: 3
    emergency_stop: false
simulated_person:
  ros__parameters:
    camera_x: 0.25
    camera_height: 1.0
    horizontal_fov: 1.20
    vertical_fov: 0.90
    camera_frame: camera_color_optical_frame
